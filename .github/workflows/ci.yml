# Main workflow for lint & testing

name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  secrets:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          curl -fsSL -o betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v1.4.0/betterleaks_1.4.0_linux_x64.tar.gz"
          tar -xzf betterleaks.tar.gz
          sudo mv betterleaks /usr/local/bin/
          betterleaks version

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          betterleaks git . \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact -v

  lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      # Setup

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install backend dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          composer-options: -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rector
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Create Rector cache directory
        run: mkdir -p tmp/rector

      - name: Cache PHPStan
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Create PHPStan cache directory
        run: mkdir -p tmp/phpstan

      # Linters

      - name: Format BE (Pint)
        run: vendor/bin/pint --parallel --test

      - name: Run Rector
        run: vendor/bin/rector process --dry-run

      - name: Lint BE (PHPStan)
        run: vendor/bin/phpstan analyse

      - name: Prepare Laravel (Wayfinder needs APP_KEY)
        run: |
          cp .env.example .env
          chmod 600 .env
          php artisan key:generate --no-interaction

      - name: Review PHP changes (Sloppy)
        run: php artisan sloppy:ci --no-interaction

      - name: Scan for compromise (Scalpel)
        run: php artisan scalpel:scan --only=structural,obfuscated,htaccess,userini,env --format=github --fail-on=HIGH --no-interaction

      - name: Generate Wayfinder TypeScript (routes & actions)
        run: php artisan wayfinder:generate --no-interaction --with-form

      - name: Check FE (Vite+)
        run: pnpm run check

      - name: Typecheck FE (vue-tsc)
        run: pnpm run types:check

  tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_PASSWORD: postgres
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov
          extensions: pdo_pgsql

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel (Wayfinder needs APP_KEY)
        run: |
          cp .env.example .env
          chmod 600 .env
          php artisan key:generate --no-interaction

      - name: Build Frontend Assets (browser tests)
        run: pnpm run build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create Testing Database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'reusables_laravel_testing'" | grep -q 1 || PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres reusables_laravel_testing

      - name: Review DB schema (Truss)
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: reusables_laravel_testing
          CACHE_STORE: array
        run: |
          php artisan migrate --force --no-interaction
          php artisan truss:doctor --fail-on=warning --no-interaction

      - name: Type Coverage Tests
        run: ./vendor/bin/pest --ci --parallel --type-coverage --min=100 --compact

      - name: Run Tests w/ Code Coverage
        run: ./vendor/bin/pest --ci --parallel --coverage --min=80 --compact

      - name: Upload Browser Test Screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-tests
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
