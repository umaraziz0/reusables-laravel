name: Feature request
description: Propose a new feature or a change to existing behaviour.
labels:
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the user or business problem this solves?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Include acceptance criteria if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
